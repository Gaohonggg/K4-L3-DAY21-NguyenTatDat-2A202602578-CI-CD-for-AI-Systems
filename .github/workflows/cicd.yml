name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements*.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
      - 'infra/systemd/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-api-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ap-southeast-1
  PYTHONUNBUFFERED: '1'

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.18'
      - name: Install dependencies
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run unit tests without cloud credentials
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.18'
      - name: Install dependencies
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Authenticate to S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.artifacts export-credentials
      - name: Pull training and holdout data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model and create precision/recall report
        run: python -m src.train --run-name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Display detailed evaluation
        run: cat outputs/detail.txt
      - name: Save evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error
      - name: Save candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: models/model.joblib
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - name: Require positive-class F1 >= 0.65
        run: python -m src.artifacts check-quality

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      SERVER_SECURITY_GROUP_ID: ${{ vars.SERVER_SECURITY_GROUP_ID }}
      SERVER_SSH_FINGERPRINT: ${{ vars.SERVER_SSH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.18'
      - name: Install storage SDK in .venv
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python boto3==1.34.113
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Authenticate to S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: python -m src.artifacts export-credentials
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: models
      - name: Allow this runner to SSH into EC2
        id: ssh_access
        run: |
          test -n "$SERVER_SSH_FINGERPRINT" || { echo 'SERVER_SSH_FINGERPRINT is required'; exit 1; }
          python -m src.ssh_access open
      - name: Upload serving code from this commit
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_SSH_FINGERPRINT }}
          source: 'src,requirements-serve.txt,infra/systemd'
          target: /opt/income-api
      - name: Prepare VM serving dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_SSH_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/income-api
            "$HOME/.local/bin/uv" pip install --python .venv/bin/python -r requirements-serve.txt
            sudo -n install -m 644 infra/systemd/income-api.service /etc/systemd/system/income-api.service
            sudo -n install -m 600 infra/systemd/income-api.env.example /etc/income-api.env
            sudo -n systemctl daemon-reload
      - name: Publish approved model and manifest
        run: python -m src.artifacts publish --version-id "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Restart API and verify deployed version
        uses: appleboy/ssh-action@v1.0.3
        env:
          EXPECTED_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_SSH_FINGERPRINT }}
          envs: EXPECTED_VERSION
          script: |
            set -eu
            cd /opt/income-api
            sudo -n systemctl restart income-api
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 3 http://127.0.0.1:8080/healthz >/dev/null; then
                if curl -fsS --max-time 3 http://127.0.0.1:8080/version | .venv/bin/python -c 'import json,os,sys; version=json.load(sys.stdin)["deployment_id"]; sys.exit(0 if version == os.environ["EXPECTED_VERSION"] else 1)'; then
                  curl -fsS --max-time 3 http://127.0.0.1:8080/score -H 'Content-Type: application/json' -d '{"features":[60,2,5,2,4,0,1,0,0,45]}' | .venv/bin/python -c 'import json,sys; d=json.load(sys.stdin); expected={0:"thu_nhap_thap",1:"thu_nhap_cao"}; sys.exit(0 if d.get("prediction") in expected and d.get("label") == expected[d["prediction"]] else 1)'
                  echo "Health, prediction and model version checks passed."
                  exit 0
                fi
              fi
              sleep 3
            done
            echo "API did not become ready with the expected model."
            sudo -n journalctl -u income-api -n 50 --no-pager
            exit 1
      - name: Remove this runner's SSH access
        if: always() && steps.ssh_access.outputs.rule_id != ''
        env:
          SSH_RULE_ID: ${{ steps.ssh_access.outputs.rule_id }}
        run: python -m src.ssh_access close
      - name: Save deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: outputs/deployment.json
          if-no-files-found: warn
